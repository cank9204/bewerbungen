<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Geschützte Seite</title>
<style>
:root{color-scheme:light;--bg:#f0f3f6;--card:#fff;--text:#1b252c;--muted:#56636d;--line:#cbd3da;--brand:#1c5068;--on-brand:#fff;--danger:#a52f2f}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1519;--card:#182026;--text:#e6ecf0;--muted:#9bacb7;--line:#37454e;--brand:#86c1d6;--on-brand:#0c161c;--danger:#f59a9a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);
  font:16px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,sans-serif}
main{width:100%;max-width:26rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{margin:0 0 4px;font-size:1.25rem}
p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=password],input[type=text]{width:100%;padding:12px;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus-visible,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.merken{display:flex;gap:8px;align-items:center;margin:12px 0;color:var(--muted);font-size:.9rem}
button{width:100%;padding:12px;font:inherit;font-weight:700;color:var(--on-brand);background:var(--brand);border:0;border-radius:8px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#fehler{min-height:1.5em;margin:12px 0 0;color:var(--danger);font-size:.95rem}
</style>
</head>
<body>
<main>
  <h1>Geschützte Seite</h1>
  <p>Bitte das Passwort eingeben, das Sie erhalten haben.</p>
  <form id="formular" autocomplete="off">
    <label for="passwort">Passwort</label>
    <input id="passwort" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required autofocus>
    <label class="merken"><input id="merken" type="checkbox"> Auf diesem Gerät merken</label>
    <button id="knopf" type="submit">Öffnen</button>
    <p id="fehler" role="alert"></p>
  </form>
</main>

<script>
(function(){
  var P = JSON.parse(document.getElementById("nutzdaten").textContent);
  var $ = function(id){ return document.getElementById(id); };
  var b64 = function(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
  var SPEICHER = "bewerbungen-zugang";
  async function entschluesseln(pw){
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(P.salt), iterations: P.it, hash: "SHA-256"}, km,
      {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    var klar = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.ct));
    return new TextDecoder().decode(klar);
  }
  function zeige(html){ document.open(); document.write(html); document.close(); }
  async function versuche(pw, merken){
    try {
      var html = await entschluesseln(pw.trim());
      if (merken) { try { localStorage.setItem(SPEICHER, pw.trim()); } catch (e) {} }
      zeige(html);
      return true;
    } catch (e) { return false; }
  }
  if (!window.crypto || !crypto.subtle) {
    $("fehler").textContent = "Dieser Browser kann die Seite nicht öffnen. Bitte die Adresse mit https:// aufrufen oder einen aktuellen Browser nutzen.";
    $("knopf").disabled = true;
    return;
  }
  var gemerkt = null;
  try { gemerkt = localStorage.getItem(SPEICHER); } catch (e) {}
  if (gemerkt) {
    versuche(gemerkt, false).then(function(ok){
      if (!ok) { try { localStorage.removeItem(SPEICHER); } catch (e) {} }
    });
  }
  $("formular").addEventListener("submit", async function(ev){
    ev.preventDefault();
    var knopf = $("knopf");
    knopf.disabled = true; knopf.textContent = "Prüfe …"; $("fehler").textContent = "";
    var ok = await versuche($("passwort").value, $("merken").checked);
    if (!ok) {
      $("fehler").textContent = "Das Passwort stimmt nicht. Bitte genau so eingeben, wie Sie es erhalten haben.";
      knopf.disabled = false; knopf.textContent = "Öffnen"; $("passwort").select();
    }
  });
})();
</script>
